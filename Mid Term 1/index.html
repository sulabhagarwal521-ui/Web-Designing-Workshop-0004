<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>
    <h1 align="center">Multimedia Player</h1>
     <section>
    <h2>Audio Section</h2>
    <audio controls >
      <source src="song.mp3" loop controls type="song.mp3">
    </audio>
  </section>

  <section>
    <h2>Video Section</h2>
    <video controls width="320" height="180" loop controls playbackrate="1.5">
      <source src="college.mp4" type="college.mp4">
      
    </video>
  </section>
</body>
</html>
