<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 17: Form Attributes and Input Validation</title>
</head>
<body>

    <form action="#" method="post" style="margin-left: 40px; margin-top: 20px;">
        <input type="text" name="fullname" placeholder="Full name" required>
        <br><br>
        <input type="email" name="email" placeholder="you@college.edu" required>
        <br><br>
        <input type="tel" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" maxlength="10" required>
        <br><br>
        <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
        <br><br>
        <input type="number" name="age" placeholder="Age (17-60)" min="17" max="60" required>
        <br><br>
        <input type="submit" value="Register">

    </form>

</body>
</html>
