<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Hotel Room Booking Form</h1>
    <form action="#"method="post"align="center">
        <!--Name-->
        <label for="fullname">Full Name:</label>
        <input type="text"id="fullname"name="fullname"placeholder="Enter your full name"required>
        <br><br>
        <!--Email-->
        <label for="email">Email:</label>
        <input type="email"id="email"name="email"placeholder="enter your email"required>
        <br><br>
        <!--Phone-->
        <label for="phone">Phone:</label>
        <input type="tel"id="phone"name="phone"placeholder="enter your phone number"required>
        <br><br>
        <!--Check-in-Date-->
        <label for="checkin">Check-in-Date:</label>
        <input type="date"id="checkin"name="checkin"required>
        <br><br>
        <!--Check-out-Date-->
        <label for="checkout">Check-out-Date:</label>
        <input type="date"id="checkout"name="checkout"required>
        <br><br>
        <!--Room-Type-->
        <label for="roomtype">Room Type:</label>
        <select id="roomtype"name="roomtype"required>
            <option value="">Select a room type</option>
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
        </select>
        <br><br>
        <!--Number-of-Guests-->
        <label for="guests">Number of Guests:</label>
        <input type="number"id="guests"name="guests"min="1"max="10"placeholder="enter number of guests"required>
        <br><br>
        <!--Special-Requests-->
        <label for="requests">Special Requests:</label>
        <textarea id="requests"name="requests"rows="4"cols="50"placeholder="enter your special request"></textarea>
        <br><br>
        <!--Submit-Button-->
        <input type="submit"value="Book Now">
        <!--Submit-Button-->
        <input type="reset"value="Reset">
    </form>
</body>
</html>
