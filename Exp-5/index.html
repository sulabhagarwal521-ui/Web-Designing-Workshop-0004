<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <form action="#"method="post"align="center">
        <!--Name-->
        <label for="fullname">Full Name:</label>
        <input type="text"id="fullname"name="fullname"placeholder="Enter your full name"requird>
        <br><br>
        <!--Email-->
        <label for="email">Email:</label>
        <input type="email"id="email"name="email"placeholder="enter your email"required>
        <br><br>
        <!--password-->
        <label for="pasword">Password</label>
        <input type="password"id="password"name="password"placeholder="emter your password"required>
        <br><br>
        <!--radio button-->
        <label for="gender">Gender:</label>
        <input type="radio"id="male"name="gender"value="male">Male
        <input type="radio"id="female"name="gender"value="female">Female
        <input type="radio"id="others"name="gender"value="others">Others
        <br><br>
        <!--course-->
        <label for="course">Course</label>
        <select id="course"name="course"required>
            <option value="">Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="B.Com">B.Com</option>
        </select>
        <br><br>
        <!--Contact no.-->
        <label for="Phone">Contact No.:</label>
        <input type="tel"id="phone"name="phone"placeholder="Enter your contact no.">
        <br><br>
        <!--Address-->
        <label for="address">Address</label>
        <textarea id="address"name="address"rows="4"cols="50"placeholder="Enter your Address"></textarea>
        <br><br>
        <!--Register-Button-->
        <input type="submit"value="Register">
        <!--clear-Button-->
        <input type="reset"value="Clear">
    </form>
</body>
</html>
