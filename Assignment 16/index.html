<!DOCTYPE html>
<html>
<head>
    <title>Assignment 16: Select, Textarea and Buttons</title>
</head>
<body>

    <div style="border: 1px solid #8fbc8f; padding: 20px; width: 500px;">
        <form>
            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="ece" selected>ECE</option>
                <option value="cse">CSE</option>
                <option value="eee">EEE</option>
                <option value="mech">MECH</option>
                <option value="civil">CIVIL</option>
            </select>
            <br><br>
            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback" rows="4" cols="40" placeholder="Write here..."></textarea>
            <br><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <input type="button" value="Click Me" onclick="alert('Button Clicked!')">
        </form>
    </div>

</body>
</html>
